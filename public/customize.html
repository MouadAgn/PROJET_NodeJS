function loadOptions() {
            const selectedModeleId = document.getElementById('modeleSelect').value;

            // Fetch des options depuis le backend en fonction du modèle sélectionné
            fetch(`http://localhost:3000/options/${selectedModeleId}`)
                .then(response => response.json())
                .then(options => {
                    optionsList.innerHTML = ''; // Effacer le contenu actuel

                    options.forEach(option => {
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.id = `option${option.id_option}`;
                        checkbox.setAttribute('data-prix', option.prix);
                        checkbox.addEventListener('change', calculateTotal);

                        const label = document.createElement('label');
                        label.htmlFor = `option${option.id_option}`;
                        label.textContent = `${option.nom} (+${option.prix}€)`;

                        optionsList.appendChild(checkbox);
                        optionsList.appendChild(label);
                        optionsList.appendChild(document.createElement('br'));
                    });

                    // Appeler la fonction calculateTotal pour mettre à jour le prix
                    calculateTotal();
                })
                .catch(error => console.error('Error fetching data:', error));
        }
